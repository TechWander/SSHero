[package]
name = "sshero-backend"
version = "0.2.0"
edition = "2021"
description = "Web/desktop backend for managing SSH connections, PTY terminals and remote files (russh + russh-sftp + axum)"

[lib]
name = "sshero_backend"
path = "src/lib.rs"

[[bin]]
name = "sshero-backend"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

russh = { version = "0.65", default-features = false, features = ["flate2", "rsa", "ring"] }
russh-sftp = "2.3"

tar = "0.4"
flate2 = "1"
futures = "0.3"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
tokio-util = { version = "0.7", features = ["io-util"] }
anyhow = "1"
async-stream = "0.3"
bytes = "1"
